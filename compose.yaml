services:
  bcfunl:
    build:
      context: .
      additional_contexts:
        vcw: ${BCFUNL_VCW_SOURCE:-../vcw}
    image: ${BCFUNL_IMAGE:-bcfunl:local}
    user: "${BCFUNL_UID:-1000}:${BCFUNL_GID:-1000}"
    init: true
    working_dir: /app
    environment:
      HOME: /state
    volumes:
      - type: bind
        source: ${BCFUNL_STAGING:?Set BCFUNL_STAGING to the existing absolute staging path}
        target: ${BCFUNL_STAGING:?Set BCFUNL_STAGING to the existing absolute staging path}
        bind:
          create_host_path: false
      - type: bind
        source: ${BCFUNL_MUSIC:?Set BCFUNL_MUSIC to the mounted absolute music path}
        target: ${BCFUNL_MUSIC:?Set BCFUNL_MUSIC to the mounted absolute music path}
        bind:
          create_host_path: false
      - type: bind
        source: ${BCFUNL_COOKIES:-./bandcamp.cookies.txt}
        target: /app/bandcamp.cookies.txt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      - type: bind
        source: ./container-state
        target: /state
        bind:
          create_host_path: false
