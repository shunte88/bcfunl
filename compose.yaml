services:
  bcfunl:
    image: ${BCFUNL_IMAGE:-ghcr.io/shunte88/bcfunl:latest}
    user: ${BCFUNL_UID:-1000}:${BCFUNL_GID:-1000}
    init: true
    working_dir: /app
    environment:
      HOME: /state
      BCFUNL_WINDOW: ${BCFUNL_WINDOW:-6}
      BCFUNL_COLLECTION: ${BCFUNL_COLLECTION:?Set BCFUNL_COLLECTION}
      BCFUNL_STAGING: ${BCFUNL_STAGING:?Set BCFUNL_STAGING}
      BCFUNL_MUSIC: ${BCFUNL_MUSIC:?Set BCFUNL_MUSIC}
      BCFUNL_TEMPLATE: ${BCFUNL_TEMPLATE:?Set BCFUNL_TEMPLATE}
      VCW_DISCOGS_TOKEN: ${VCW_DISCOGS_TOKEN?Set VCW_DISCOGS_TOKEN}
      VCW_ACOUSTID_KEY: ${VCW_ACOUSTID_KEY?Set VCW_ACOUSTID_KEY}
      VCW_CONTACT: ${VCW_CONTACT?Set VCW_CONTACT}
    volumes:
      - type: bind
        source: ${BCFUNL_STAGING:?Set BCFUNL_STAGING}
        target: ${BCFUNL_STAGING:?Set BCFUNL_STAGING}
        bind:
          create_host_path: false
      - type: bind
        source: ${BCFUNL_MUSIC:?Set BCFUNL_MUSIC}
        target: ${BCFUNL_MUSIC:?Set BCFUNL_MUSIC}
        bind:
          create_host_path: false
      - type: bind
        source: ${BCFUNL_COOKIES:-./bandcamp.cookies.txt}
        target: /app/bandcamp.cookies.txt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      - type: bind
        source: ./container-state
        target: /state
        bind:
          create_host_path: false
    entrypoint:
      - /bin/sh
      - -ec
      - >
        mode="$${1:-}"

        if [ "$$#" -gt 0 ]; then
          shift
        fi


        case "$${mode}" in
          database)
            echo "BCFunl :: First touch database maintenance"

            exec /app/bcfunl --database \
              --user "$${BCFUNL_COLLECTION}" \
              --output "$${BCFUNL_STAGING}" \
              "$$@"
            ;;

          acquire)
            BCFUNL_TODT="$$(date +%F)"
            BCFUNL_FROMDT="$$(date -d "$${BCFUNL_ENDDT} $${BCFUNL_WINDOW} days ago" +%F)"
            export BCFUNL_FROMDT BCFUNL_TODT

            echo "BCFunl :: Acquiring from $${BCFUNL_FROMDT} through $${BCFUNL_TODT}"

              #--fromdt "$${BCFUNL_FROMDT}" \
              #--todt "$${BCFUNL_TODT}" \
              # here we just using a test count
            exec /app/bcfunl \
              --user "$${BCFUNL_COLLECTION}" \
              --output "$${BCFUNL_STAGING}" \
              --count 100 \
              --parallel 8 \
              --summary \
              "$$@"
            ;;

          process)
            echo "BCFunl :: Processing staged releases"

            # here we're just using a test count
            # and no clean so we have the files
            # available for review should we need
            exec /app/bcfunl \
              --process \
              --user "$${BCFUNL_COLLECTION}" \
              --output "$${BCFUNL_STAGING}" \
              --serverdir "$${BCFUNL_MUSIC}" \
              --count 100 \
              --parallel 8 \
              --template "$${BCFUNL_TEMPLATE}" \
              --summary \
              --timings \
              --clean \
              "$$@"
            ;;

          *)
            echo "Usage: bcfunl database|acquire|process [extra arguments]" >&2
            exit 2
            ;;
        esac
      - bcfunl
    command:
      - acquire
networks: {}
