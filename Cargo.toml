[package]
name = "bcfunl"
version = "0.1.49"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
rand = "0.8"
libc = "0.2"
signal-hook-registry = "1.4"
tokio = { version = "1.48", features = ["rt", "rt-multi-thread", "time", "macros"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.24"
serde_json = "1.0"
unicode-width = "0.2"
vcw-metadata = { path = "../vcw/crates/metadata", default-features = false }
serde_yaml = "0.9.34"
quick-xml = "0.37.5"

symphonia = { version = "0.5.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav", "aiff"] }
lofty = "0.25"
sha2 = "0.10"
rayon = "1.11"
zip = { version = "9.3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
chrono = "0.4"
