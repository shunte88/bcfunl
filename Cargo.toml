[package]
name = "bcfunl"
version = "0.1.23"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
rand = "0.8"
libc = "0.2"
signal-hook-registry = "1.4"
tokio = { version = "1.48", features = ["rt", "time", "macros"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.24"
serde_json = "1.0"
unicode-width = "0.2"
vcw-metadata = { path = "../vcw/crates/metadata", default-features = false }
serde_yaml = "0.9.34"
quick-xml = "0.37.5"

[build-dependencies]
chrono = "0.4"
